ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/eslint-config@9.5.1'
  - eslint-plugin-slop@0.1.3
  - tsx@4.23.15

# uni-app's dependency tree pins legacy versions (vite 5, rollup 4, plugin-legacy…),
# which trips `no-downgrade` on every install; keep other supply-chain guards on.
trustPolicy: off
trustPolicyExclude:
  # pinned by @types/node@20, required by vue-tsc
  - undici-types@6.21.0

update:
  ignoreDeps:
    - typescript@7

dangerouslyAllowAllBuilds: true
shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalog:
  '@dcloudio/types': ^3.4.8
  '@dcloudio/uni-app': 3.0.0-5020420260813003
